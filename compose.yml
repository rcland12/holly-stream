services:
  app:
    container_name: holly-stream-app
    image: rcland12/detection-stream:jetson-latest
    build:
      context: ./app
    runtime: nvidia
    privileged: true
    network_mode: host
    group_add:
      - audio
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - ./models:/models
    env_file: .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    container_name: holly-stream-nginx
    image: rcland12/detection-stream:nginx-latest
    build:
      context: ./nginx
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && kill -0 $$(cat /tmp/nginx.pid)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
