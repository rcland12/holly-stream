services:
  app:
    container_name: holly-stream-app
    image: rcland12/detection-stream:jetson-latest
    build:
      context: ./app
    runtime: nvidia
    privileged: true
    network_mode: host
    group_add:
      - audio
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - ./models:/models
    env_file: .env
    environment:
      # Set by run.sh; entrypoint.sh stays stopped if Docker starts this container in a later boot
      HOLLY_BOOT_ID: ${HOLLY_BOOT_ID:-}
    # holly-stream runs only between run.sh and stop.sh. on-failure brings the app back after errors and watchdog
    # stalls (non-zero exits); a SIGTERM from docker-compose down or a shutdown exits 0 and is not restarted, and the
    # boot ID check in entrypoint.sh covers restarts after a power cut.
    restart: on-failure
    # Longer than the app's own 10 second shutdown, so a stop is never mistaken for a failure
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    container_name: holly-stream-nginx
    image: rcland12/detection-stream:nginx-latest
    build:
      context: ./nginx
    network_mode: host
    # Started by run.sh when publishing locally; never on boot
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && kill -0 $$(cat /tmp/nginx.pid)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
