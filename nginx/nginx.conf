load_module modules/ngx_rtmp_module.so;

worker_processes 1;
pid /tmp/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        listen [::]:8080;

        server_name localhost;

        location / {
            root /var/www/html/stream;
            index index.html;
        }

        location /hls {
            root /var/www/html/stream;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods GET;
            add_header Access-Control-Allow-Headers Range;
            add_header Access-Control-Expose-Headers Content-Length,Content-Range;
            add_header Cache-Control "no-cache";

            # The player polls for the playlist while the stream is offline
            log_not_found off;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        allow publish 127.0.0.0/8;
        allow publish 10.0.0.0/8;
        allow publish 172.16.0.0/12;
        allow publish 192.168.0.0/16;
        deny publish all;

        # Publish to rtmp://<pi>:1935/live/<key>
        #   VLC:     rtmp://<pi>:1935/live/<key>
        #   Browser: http://<pi>:8080/?key=<key>  (HLS at /hls/<key>.m3u8)
        application live {
            live on;
            record off;
            allow play all;

            hls on;
            hls_path /var/www/html/stream/hls;
            hls_fragment 2s;
            hls_playlist_length 20s;
            hls_cleanup on;
        }
    }
}
