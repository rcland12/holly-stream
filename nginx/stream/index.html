<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<title>Holly Stream</title>
	<style>
		:root {
			--bg: #0b0d12;
			--surface: #151922;
			--surface-2: #1d2230;
			--border: #262c3b;
			--text: #e8ebf2;
			--muted: #8b93a7;
			--accent: #6d8bff;
			--live: #ff4d5e;
			--ok: #34d399;
			--warn: #fbbf24;
			--radius: 16px;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			background: radial-gradient(1200px 600px at 50% -200px, #1a2140 0%, var(--bg) 60%);
			color: var(--text);
			font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}

		.page {
			max-width: 1200px;
			margin: 0 auto;
			padding: 24px 20px 40px;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			margin-bottom: 20px;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.brand svg {
			width: 36px;
			height: 36px;
			padding: 8px;
			border-radius: 10px;
			background: var(--surface-2);
			color: var(--accent);
		}

		h1 {
			margin: 0;
			font-size: 20px;
			font-weight: 650;
			letter-spacing: -0.01em;
		}

		.subtitle {
			color: var(--muted);
			font-size: 13px;
		}

		.status {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 6px 12px;
			border: 1px solid var(--border);
			border-radius: 999px;
			background: var(--surface);
			font-size: 13px;
			font-weight: 600;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			white-space: nowrap;
		}

		.status .dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--muted);
		}

		.status[data-state="live"] .dot {
			background: var(--live);
			box-shadow: 0 0 0 0 rgba(255, 77, 94, 0.7);
			animation: pulse 1.6s infinite;
		}

		.status[data-state="connecting"] .dot { background: var(--warn); }

		@keyframes pulse {
			70% { box-shadow: 0 0 0 8px rgba(255, 77, 94, 0); }
			100% { box-shadow: 0 0 0 0 rgba(255, 77, 94, 0); }
		}

		.player {
			position: relative;
			aspect-ratio: 16 / 9;
			max-height: 78vh;
			margin: 0 auto;
			overflow: hidden;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			background: #000;
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
		}

		video {
			display: block;
			width: 100%;
			height: 100%;
			background: #000;
		}

		.overlay {
			position: absolute;
			inset: 0;
			display: grid;
			place-content: center;
			justify-items: center;
			gap: 14px;
			padding: 24px;
			background: rgba(8, 10, 14, 0.82);
			color: var(--muted);
			text-align: center;
			transition: opacity 0.3s;
		}

		.overlay[hidden] { display: none; }

		.overlay strong {
			color: var(--text);
			font-size: 17px;
			font-weight: 600;
		}

		.spinner {
			width: 36px;
			height: 36px;
			border: 3px solid var(--border);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: spin 0.9s linear infinite;
		}

		@keyframes spin { to { transform: rotate(360deg); } }

		.offline-icon {
			width: 40px;
			height: 40px;
			color: var(--muted);
		}

		.spinner[hidden], .offline-icon[hidden] { display: none; }

		.toolbar {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-top: 16px;
		}

		.stats, .actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.chip {
			padding: 6px 12px;
			border: 1px solid var(--border);
			border-radius: 10px;
			background: var(--surface);
			color: var(--muted);
			font-size: 13px;
		}

		.chip b {
			color: var(--text);
			font-weight: 600;
			font-variant-numeric: tabular-nums;
		}

		button {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 8px 14px;
			border: 1px solid var(--border);
			border-radius: 10px;
			background: var(--surface-2);
			color: var(--text);
			font: inherit;
			font-size: 14px;
			font-weight: 550;
			cursor: pointer;
			transition: background 0.15s, border-color 0.15s;
		}

		button:hover { background: #262c3d; border-color: #343b4e; }
		button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; }
		button.primary:hover { background: #8aa1ff; }
		button[hidden] { display: none; }

		.panel {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
			gap: 12px;
			margin-top: 24px;
		}

		.card {
			padding: 16px;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			background: var(--surface);
		}

		.card h2 {
			margin: 0 0 10px;
			color: var(--muted);
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 0.06em;
			text-transform: uppercase;
		}

		.row {
			display: flex;
			gap: 8px;
		}

		code, input {
			flex: 1;
			min-width: 0;
			padding: 8px 12px;
			border: 1px solid var(--border);
			border-radius: 10px;
			background: var(--bg);
			color: var(--text);
			font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
		}

		code {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

		.hint {
			margin: 8px 0 0;
			color: var(--muted);
			font-size: 12px;
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<div class="brand">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M23 7l-7 5 7 5V7z"></path>
					<rect x="1" y="5" width="15" height="14" rx="2"></rect>
				</svg>
				<div>
					<h1>Holly Stream</h1>
					<div class="subtitle" id="subtitle"></div>
				</div>
			</div>
			<div class="status" id="status" data-state="connecting" role="status">
				<span class="dot"></span><span id="status-text">Connecting</span>
			</div>
		</header>

		<div class="player" id="player">
			<video id="video" controls playsinline muted></video>
			<div class="overlay" id="overlay">
				<div class="spinner" id="spinner"></div>
				<svg class="offline-icon" id="offline-icon" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path>
					<line x1="1" y1="1" x2="23" y2="23"></line>
				</svg>
				<strong id="overlay-title">Connecting to stream</strong>
				<span id="overlay-text">Looking for a stream to play.</span>
			</div>
		</div>

		<div class="toolbar">
			<div class="stats">
				<span class="chip">Resolution <b id="stat-resolution">–</b></span>
				<span class="chip">Delay <b id="stat-delay">–</b></span>
			</div>
			<div class="actions">
				<button class="primary" id="unmute" hidden>Unmute</button>
				<button id="go-live" hidden>Jump to live</button>
			</div>
		</div>

		<div class="panel">
			<div class="card">
				<h2>Open in VLC</h2>
				<div class="row">
					<code id="rtmp-url"></code>
					<button data-copy="rtmp-url">Copy</button>
				</div>
				<p class="hint">Media → Open Network Stream. Lower delay than the browser.</p>
			</div>
			<div class="card">
				<h2>Stream key</h2>
				<form class="row" id="key-form">
					<input id="key-input" name="key" autocomplete="off" spellcheck="false" aria-label="Stream key">
					<button type="submit">Watch</button>
				</form>
				<p class="hint">Matches STREAM_KEY. Published to rtmp://&lt;pi&gt;:1935/live/&lt;key&gt;.</p>
			</div>
		</div>
	</div>

	<script src="vendor/hls.min.js"></script>
	<script>
		const key = new URLSearchParams(location.search).get("key") || "stream";
		const src = `hls/${encodeURIComponent(key)}.m3u8`;
		const retryMs = 5000;

		const video = document.getElementById("video");
		const player = document.getElementById("player");
		const overlay = document.getElementById("overlay");
		const unmuteButton = document.getElementById("unmute");
		const goLiveButton = document.getElementById("go-live");

		document.title = `Holly Stream · ${key}`;
		document.getElementById("subtitle").textContent = `live/${key}`;
		document.getElementById("key-input").value = key;
		document.getElementById("rtmp-url").textContent = `rtmp://${location.hostname}:1935/live/${key}`;

		let hls = null;
		let retryTimer = null;
		let lastTime = 0;
		let stalledSince = null;

		function setState(state) {
			const labels = { connecting: "Connecting", live: "Live", offline: "Offline" };
			document.getElementById("status").dataset.state = state;
			document.getElementById("status-text").textContent = labels[state];

			overlay.hidden = state === "live";
			document.getElementById("spinner").hidden = state !== "connecting";
			// The icon is an SVG element, which has no .hidden property, so set the attribute directly
			document.getElementById("offline-icon").toggleAttribute("hidden", state !== "offline");
			if (state === "connecting") {
				document.getElementById("overlay-title").textContent = "Connecting to stream";
				document.getElementById("overlay-text").textContent = "Looking for a stream to play.";
			} else if (state === "offline") {
				document.getElementById("overlay-title").textContent = "Stream is offline";
				document.getElementById("overlay-text").textContent =
					`Nothing is publishing to live/${key}. Retrying every ${retryMs / 1000}s.`;
				document.getElementById("stat-delay").textContent = "–";
				document.getElementById("stat-resolution").textContent = "–";
			}
			goLiveButton.hidden = state !== "live";
		}

		function scheduleRetry() {
			setState("offline");
			clearTimeout(retryTimer);
			retryTimer = setTimeout(start, retryMs);
		}

		function stop() {
			if (hls) {
				hls.destroy();
				hls = null;
			}
			video.removeAttribute("src");
			video.load();
		}

		function start() {
			stop();
			stalledSince = null;
			setState("connecting");

			if (window.Hls && Hls.isSupported()) {
				hls = new Hls({ liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 8, backBufferLength: 30 });
				hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
				hls.on(Hls.Events.ERROR, (_, data) => {
					if (!data.fatal) return;
					if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
						hls.recoverMediaError();
					} else {
						stop();
						scheduleRetry();
					}
				});
				hls.loadSource(src);
				hls.attachMedia(video);
			} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
				// Safari plays HLS natively
				video.src = src;
				video.play().catch(() => {});
			} else {
				setState("offline");
				document.getElementById("overlay-text").textContent = "This browser cannot play HLS.";
			}
		}

		function liveEdge() {
			if (hls && hls.liveSyncPosition) return hls.liveSyncPosition;
			return video.seekable.length ? video.seekable.end(video.seekable.length - 1) : null;
		}

		video.addEventListener("playing", () => setState("live"));
		video.addEventListener("error", () => { stop(); scheduleRetry(); });
		video.addEventListener("volumechange", () => { unmuteButton.hidden = !video.muted; });
		video.addEventListener("loadedmetadata", () => {
			if (video.videoWidth && video.videoHeight) {
				player.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
				document.getElementById("stat-resolution").textContent = `${video.videoWidth}×${video.videoHeight}`;
			}
		});

		unmuteButton.hidden = !video.muted;
		unmuteButton.addEventListener("click", () => { video.muted = false; video.play().catch(() => {}); });
		goLiveButton.addEventListener("click", () => {
			const edge = liveEdge();
			if (edge) video.currentTime = edge;
			video.play().catch(() => {});
		});

		document.querySelectorAll("[data-copy]").forEach((button) => {
			button.addEventListener("click", async () => {
				const text = document.getElementById(button.dataset.copy).textContent;
				try {
					await navigator.clipboard.writeText(text);
				} catch {
					// navigator.clipboard needs HTTPS or localhost, so fall back for plain http on the LAN
					const area = Object.assign(document.createElement("textarea"), { value: text });
					document.body.append(area);
					area.select();
					document.execCommand("copy");
					area.remove();
				}
				button.textContent = "Copied";
				setTimeout(() => { button.textContent = "Copy"; }, 1500);
			});
		});

		// Once a second: update stats, and restart if playback has frozen (the publisher stopped)
		setInterval(() => {
			const delay = liveEdge() && !video.paused ? Math.max(0, liveEdge() - video.currentTime) : null;
			if (hls && hls.latency) {
				document.getElementById("stat-delay").textContent = `${hls.latency.toFixed(1)} s`;
			} else if (delay !== null) {
				document.getElementById("stat-delay").textContent = `${delay.toFixed(1)} s`;
			}

			if (video.paused || document.getElementById("status").dataset.state !== "live") {
				stalledSince = null;
				return;
			}
			if (video.currentTime !== lastTime) {
				lastTime = video.currentTime;
				stalledSince = null;
			} else if (stalledSince === null) {
				stalledSince = Date.now();
			} else if (Date.now() - stalledSince > 10000) {
				stop();
				scheduleRetry();
			}
		}, 1000);

		start();
	</script>
</body>
</html>
